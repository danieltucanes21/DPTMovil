# CI-01 (SCRUMBAN-133): en cada push a main y en cada pull request hacia main
# (o a mano, con workflow_dispatch) revisa el analizador y
# corre la suite sin backend. Fuera quedan la suite remota
# (test/main_test.dart, necesita el backend) y la de diagnostico
# (test/diagnostico, roja a proposito).
name: CI

on:
  push:
    branches:
      - main
  # rama de destino del PR
  pull_request:
    branches:
      - main
  workflow_dispatch:

# un push nuevo a la misma rama cancela la corrida anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # el primer build del APK, sin cache de Gradle, tarda varios minutos
    timeout-minutes: 30
    # con shell: bash explicito GitHub agrega pipefail: sin el, el "| tee" del
    # analizador ocultaria sus errores
    defaults:
      run:
        shell: bash
    env:
      # la zona horaria de los equipos de desarrollo: hay pruebas de fechas
      # que dependen del dia local
      TZ: America/Bogota
      # linea base de avisos de flutter analyze. Si una correccion la baja,
      # bajar tambien este numero; nunca subirlo para que el CI pase
      LIMITE_AVISOS: 27

    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v4

      # JDK 17: lo exige el Android Gradle Plugin 8.7 del proyecto para el
      # build del APK. cache: gradle guarda las dependencias de Gradle entre
      # corridas
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Instalar Flutter 3.41.3
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.3
          cache: true

      - name: Dependencias
        run: flutter pub get

      # falla solo con errores; los avisos se vigilan en el paso siguiente
      - name: Analizador
        run: flutter analyze --no-fatal-infos --no-fatal-warnings | tee analisis.txt

      - name: Avisos dentro de la linea base
        run: |
          avisos=$(grep -cE '^\s*warning\b' analisis.txt || true)
          echo "Avisos: $avisos (limite: $LIMITE_AVISOS)"
          if [ "$avisos" -gt "$LIMITE_AVISOS" ]; then
            echo "::error::flutter analyze da $avisos avisos; la linea base es $LIMITE_AVISOS"
            exit 1
          fi

      - name: Suite sin backend
        run: flutter test test/unitarias test/raiz_composicion_test.dart test/integracion

      # APK de depuracion: comprueba que la app compila para Android. Va al
      # final para que un fallo del analizador o de las pruebas se vea antes.
      # Usa el backend por defecto (API_HOST=10.0.2.2, el emulador)
      - name: Build del APK
        run: flutter build apk --debug
